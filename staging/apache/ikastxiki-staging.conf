<VirtualHost *:18443>
    ServerName staging.ikastxiki.example
    DocumentRoot /var/www/ikastxiki-staging/frontend/build
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/staging.ikastxiki.example/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/staging.ikastxiki.example/privkey.pem
    <Directory /var/www/ikastxiki-staging/frontend/build>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>
    ProxyPreserveHost On
    ProxyTimeout 35
    RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
    LimitRequestBody 10485760
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass /api http://127.0.0.1:18003/api
    ProxyPassReverse /api http://127.0.0.1:18003/api
    ProxyPass /uploads http://127.0.0.1:18003/uploads
    ProxyPassReverse /uploads http://127.0.0.1:18003/uploads
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    ErrorLog ${APACHE_LOG_DIR}/ikastxiki-staging-error.log
    CustomLog ${APACHE_LOG_DIR}/ikastxiki-staging-access.log combined
</VirtualHost>
